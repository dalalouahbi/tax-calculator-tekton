apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline
spec:
  workspaces:
    - name: shared-workspace
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
    - name: npm-install
      runAfter: [fetch-source]
      taskRef:
        name: npm-install-task
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: tests
      runAfter: [npm-install]
      taskRef:
        name: jasmine-test-task
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: build
      runAfter: [tests]
      taskRef:
        name: build-image-task
      workspaces:
        - name: source
          workspace: shared-workspace
